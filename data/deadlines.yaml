    holiday_rule: next_business_day
    scope: tax
    leads: [14, 7, 3, 1, 0]
    basis: 지방세법 — 법인세 신고기한 종료일부터 1개월 이내 (확인 필요)
    source: https://www.law.go.kr/
    note: 기한 근거 조문을 원문으로 확인하지 못했다. 반드시 검증 후 verified를 올린다
    verified: false

  - id: vat-return
    name: 부가가치세 신고·납부
    category: 세무
    recurrence: { months: [1, 4, 7, 10], day: 25 }
    holiday_rule: next_business_day
    scope: tax
    leads: [7, 3, 1, 0]
    basis: 확정신고 1/25·7/25, 예정신고 4/25·10/25
    source: https://www.nts.go.kr/nts/ad/taxSchdul/selectList.do?mi=135747
    note: 보험업은 대부분 면세사업이나 과세 겸영분이 있으면 해당한다. 해당 여부를 확인할 것
    verified: false

  - id: education-tax
    name: 교육세 신고·납부 (금융·보험업자)
    category: 세무
    recurrence: { months: [1, 4, 7, 10], day: last }
    holiday_rule: next_business_day
    scope: tax
    leads: [14, 7, 3, 1, 0]
    basis: |
      교육세법 제8조 — 금융·보험업자의 과세기간은 분기(1~3월, 4~6월, 7~9월, 10~12월).
      제9조의 신고·납부기한은 원문 확인이 필요하다. 아래 recurrence는 과세기간 종료 다음 달
      말일로 가정해 둔 임시값이다.
    source: https://www.law.go.kr/
    note: |
      기한과 과세기간 대응을 교육세법 제9조 원문으로 반드시 확인할 것 — 현재 recurrence는
      검증되지 않은 가정이다. 과세표준은 수익금액, 세율은 수익금액의 5/1,000이며,
      연간 수익 1조원 초과 금융·보험사 대상 1.0% 인상 개정이 진행 중이다(우리 회사 해당
      여부 확인 필요). 자금 관점에서는 분기마다 나가는 현금 유출이다.
    verified: false

  # ===================== 감독 보고 =====================
  - id: fss-monthly-report
    name: 업무보고서 (월) 제출
    category: 감독보고
    recurrence: { day: last }
    holiday_rule: none
    scope: govt
    leads: [7, 3, 1, 0]
    basis: 보험업법 제118조 제2항 — 매월의 업무 내용을 다음 달 말일까지 제출
    source: https://www.law.go.kr/
    note: |
      항목별 작성주기·보고기한은 보험업감독업무시행세칙 별지 제26호·제26-2호에 따른다.
      우리 팀이 실제로 담당하는 항목과 그 기한을 별지에서 확인해 세분화할 것.
      holiday_rule을 none으로 둔 것은 보정 방향을 확인하지 못했기 때문이다.
    verified: false

  - id: fx-business-monthly

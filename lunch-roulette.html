<title>오늘 점심 룰렛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
  /* Layout: 식당 주문표(전표) 느낌의 단일 화면 — 왼쪽 룰렛, 오른쪽 메뉴판. 좁으면 세로로 쌓임 */
  :root {
    --bg: #eef1ea;
    --paper: #fbfcf8;
    --ink: #1e2a22;
    --muted: #5d6b61;
    --line: #cdd5cb;
    --accent: #d8402b;
    --accent-ink: #ffffff;
    --pin: #1e2a22;
    --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --font-hand: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141a16; --paper: #1c241f; --ink: #e8eee6; --muted: #9aa89e;
      --line: #334038; --accent: #f0624a; --accent-ink: #1a0f0c; --pin: #e8eee6;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141a16; --paper: #1c241f; --ink: #e8eee6; --muted: #9aa89e;
    --line: #334038; --accent: #f0624a; --accent-ink: #1a0f0c; --pin: #e8eee6;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.55;
  }
  .wrap {
    max-width: 1040px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 28px 40px;
    display: grid;
    gap: 24px;
  }
  header { display: grid; gap: 4px; }
  .eyebrow {
    font-size: 12px; letter-spacing: .14em; color: var(--muted);
    text-transform: uppercase; font-weight: 600;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(34px, 6vw, 54px);
    line-height: 1.05;
    margin: 0;
    text-wrap: balance;
  }
  h1 em { font-style: normal; color: var(--accent); }

  .main {
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 760px) { .main { grid-template-columns: minmax(0, 1fr); } }

  .stage { display: grid; gap: 18px; justify-items: center; min-width: 0; }
  .wheel-box { position: relative; width: min(100%, 460px); aspect-ratio: 1; max-width: 100%; }
  canvas { width: 100%; height: 100%; display: block; }
  .pointer {
    position: absolute; left: 50%; top: -6px; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 16px solid transparent; border-right: 16px solid transparent;
    border-top: 30px solid var(--pin);
    filter: drop-shadow(0 2px 0 var(--bg));
    transform-origin: 50% 0;
  }
  .pointer.tick { animation: tick .09s ease-out; }
  @keyframes tick { 50% { transform: translateX(-50%) rotate(-12deg); } }

  .spin {
    font-family: var(--font-display);
    font-size: 22px; letter-spacing: .04em;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 999px;
    padding: 14px 44px; cursor: pointer;
    box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 60%, var(--ink));
    transition: transform .08s, box-shadow .08s;
  }
  .spin:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 60%, var(--ink)); }
  .spin:disabled { opacity: .55; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* 주문 전표 */
  .ticket {
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 18px 20px 20px;
    display: grid; gap: 16px;
    min-width: 0;
    position: relative;
  }
  .ticket::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px;
    background: radial-gradient(circle at 6px 0, transparent 6px, var(--paper) 6.5px) 0 0 / 12px 8px repeat-x;
  }
  .ticket-head {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    border-bottom: 2px dashed var(--line); padding-bottom: 10px;
  }
  .ticket-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 0; }
  .ticket-no { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .result { display: grid; gap: 2px; min-height: 84px; align-content: center; }
  .result-label { font-size: 12px; color: var(--muted); letter-spacing: .1em; }
  .result-name {
    font-family: var(--font-display); font-size: 40px; line-height: 1.1;
    color: var(--ink); overflow-wrap: anywhere;
  }
  .result-name.win { color: var(--accent); animation: pop .4s ease-out; }
  .result-note { font-family: var(--font-hand); color: var(--muted); font-size: 15px; }
  @keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }

  .menu-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .menu-list li {
    display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; align-items: center; gap: 10px;
    padding: 6px 4px; border-bottom: 1px dotted var(--line);
  }
  .menu-list li.hit { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .menu-name { overflow-wrap: anywhere; }
  .menu-name small { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .del {
    border: 0; background: none; color: var(--muted); cursor: pointer;
    font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 4px;
  }
  .del:hover:not(:disabled) { color: var(--accent); }
  .del:disabled { opacity: .3; cursor: default; }

  .add { display: flex; gap: 8px; }
  .add input {
    flex: 1; min-width: 0; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
  }
  .btn {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--ink); color: var(--paper); border: 0; border-radius: 6px; padding: 8px 14px;
  }
  .btn.ghost { background: none; color: var(--muted); border: 1px solid var(--line); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--muted); margin: 0; }

  .history { display: flex; flex-wrap: wrap; gap: 6px; }
  .history span {
    font-size: 13px; padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .result-name.win, .pointer.tick { animation: none; }
  }
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">Lunch Roulette · 오늘의 한 끼</span>
    <h1>오늘 점심, <em>룰렛</em>이 정해드립니다</h1>
  </header>

  <div class="main">
    <section class="stage" aria-label="룰렛">
      <div class="wheel-box">
        <canvas id="wheel" aria-hidden="true"></canvas>
        <div class="pointer" id="pointer"></div>
      </div>
      <button class="spin" id="spin">돌리기!</button>
    </section>

    <aside class="ticket" aria-label="주문 전표">
      <div class="ticket-head">
        <h2>주문 전표</h2>
        <span class="ticket-no" id="ticketNo">No. 0001</span>
      </div>

      <div class="result" aria-live="polite">
        <span class="result-label">오늘의 메뉴</span>
        <span class="result-name" id="resultName">?</span>
        <span class="result-note" id="resultNote">버튼을 눌러 룰렛을 돌려보세요.</span>
      </div>

      <div class="row">
        <strong>메뉴판 <span id="count" class="hint"></span></strong>
        <button class="btn ghost" id="reset" type="button">기본 메뉴로</button>
      </div>
      <ul class="menu-list" id="menuList"></ul>

      <form class="add" id="addForm">
        <label for="newMenu" class="hint" hidden>새 메뉴</label>
        <input id="newMenu" maxlength="12" placeholder="메뉴 추가 (예: 칼국수)" autocomplete="off">
        <button class="btn" type="submit">추가</button>
      </form>
      <p class="hint" id="formHint">메뉴는 2개부터 16개까지 넣을 수 있어요.</p>

      <div class="row"><strong>최근 결과</strong></div>
      <div class="history" id="history"><span>아직 없음</span></div>
    </aside>
  </div>
</div>

<script>
(() => {
  const DEFAULTS = [
    { name: "김치찌개", tag: "한식" },
    { name: "제육볶음", tag: "한식" },
    { name: "돈까스", tag: "일식" },
    { name: "짜장면", tag: "중식" },
    { name: "국밥", tag: "한식" },
    { name: "비빔밥", tag: "한식" },
    { name: "초밥", tag: "일식" },
    { name: "쌀국수", tag: "아시안" },
    { name: "마라탕", tag: "중식" },
    { name: "햄버거", tag: "양식" },
  ];
  const NOTES = {
    "김치찌개": "공깃밥 추가는 국룰입니다.",
    "제육볶음": "상추 쌈 싸서 든든하게.",
    "돈까스": "소스는 부먹? 찍먹?",
    "짜장면": "곱빼기로 갈까요?",
    "국밥": "뜨끈한 국물로 오후까지 버팁니다.",
    "비빔밥": "고추장 넉넉히, 계란 반숙.",
    "초밥": "오늘은 조금 사치해도 괜찮아요.",
    "쌀국수": "고수는 빼달라고 미리 말하기.",
    "마라탕": "맵기 단계는 신중하게.",
    "햄버거": "감자튀김까지 세트로.",
  };
  const COLORS = ["#d8402b", "#f2a33a", "#2f7d5b", "#3b6fb6", "#8a4fa3", "#e0703f", "#c9b12e", "#1f9a96", "#b8345e", "#5a7d2a", "#6b5ba8", "#c4572f", "#2c8c6d", "#d68a1f", "#4a6aa8", "#9a3f6b"];
  const STORE_KEY = "lunch-roulette-menus";
  const MAX = 16, MIN = 2;

  let menus = load();
  let rotation = 0;
  let spinning = false;
  let lastIndex = -1;
  let ticketNo = 1;
  const history = [];

  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const pointer = document.getElementById("pointer");
  const spinBtn = document.getElementById("spin");
  const resultName = document.getElementById("resultName");
  const resultNote = document.getElementById("resultNote");
  const listEl = document.getElementById("menuList");
  const countEl = document.getElementById("count");
  const historyEl = document.getElementById("history");
  const formHint = document.getElementById("formHint");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function load() {
    try {
      const v = JSON.parse(localStorage.getItem(STORE_KEY));
      if (Array.isArray(v) && v.length >= MIN) return v;
    } catch (e) {}
    return DEFAULTS.map(m => ({ ...m }));
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(menus)); } catch (e) {}
  }

  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function resize() {
    const r = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    draw();
  }

  function draw() {
    const W = canvas.width, H = canvas.height;
    if (!W) return;
    const cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2 - W * 0.02;
    const n = menus.length, arc = (Math.PI * 2) / n;
    ctx.clearRect(0, 0, W, H);

    // 바깥 테두리
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = cssVar("--ink"); ctx.fill();

    const r = R * 0.95;
    for (let i = 0; i < n; i++) {
      const a0 = -Math.PI / 2 + rotation + i * arc;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, a0, a0 + arc); ctx.closePath();
      ctx.fillStyle = COLORS[i % COLORS.length]; ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = W * 0.004; ctx.stroke();

      ctx.save();
      ctx.translate(cx, cy); ctx.rotate(a0 + arc / 2);
      ctx.textAlign = "right"; ctx.textBaseline = "middle";
      const label = menus[i].name;
      let size = Math.min(W * 0.052, (r * arc) * 0.42);
      ctx.font = `${size}px "Black Han Sans", sans-serif`;
      const maxW = r * 0.62;
      while (ctx.measureText(label).width > maxW && size > 8) { size -= 1; ctx.font = `${size}px "Black Han Sans", sans-serif`; }
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = W * 0.006;
      ctx.fillText(label, r * 0.9, 0);
      ctx.restore();
    }

    // 가운데 허브
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.13, 0, Math.PI * 2);
    ctx.fillStyle = cssVar("--paper"); ctx.fill();
    ctx.lineWidth = W * 0.01; ctx.strokeStyle = cssVar("--ink"); ctx.stroke();
    ctx.fillStyle = cssVar("--ink");
    ctx.font = `${W * 0.04}px "Black Han Sans", sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("점심", cx, cy + W * 0.002);
  }

  function indexAtPointer() {
    const n = menus.length, arc = (Math.PI * 2) / n;
    const a = ((-rotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    return Math.floor(a / arc) % n;
  }

  function spin() {
    if (spinning || menus.length < MIN) return;
    spinning = true; setBusy(true);
    const n = menus.length, arc = (Math.PI * 2) / n, TAU = Math.PI * 2;
    const winner = Math.floor(Math.random() * n);
    const jitter = (Math.random() - 0.5) * arc * 0.7;
    const target = ((-(winner + 0.5) * arc - jitter) % TAU + TAU) % TAU;
    const cur = ((rotation % TAU) + TAU) % TAU;
    const delta = ((target - cur) % TAU + TAU) % TAU;
    const turns = reduceMotion ? 1 : 5 + Math.floor(Math.random() * 3);
    const start = rotation, end = rotation + turns * TAU + delta;
    const dur = reduceMotion ? 900 : 4600;
    const t0 = performance.now();
    let lastSeg = indexAtPointer();
    resultName.classList.remove("win");
    resultName.textContent = "두구두구…";
    resultNote.textContent = "어떤 메뉴가 나올까요?";
    clearHit();

    function frame(now) {
      const p = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - p, 4);
      rotation = start + (end - start) * e;
      draw();
      const seg = indexAtPointer();
      if (seg !== lastSeg && !reduceMotion) {
        lastSeg = seg;
        pointer.classList.remove("tick"); void pointer.offsetWidth; pointer.classList.add("tick");
      }
      if (p < 1) requestAnimationFrame(frame);
      else finish(winner);
    }
    requestAnimationFrame(frame);
  }

  function finish(i) {
    spinning = false; setBusy(false);
    lastIndex = i;
    const m = menus[i];
    resultName.textContent = m.name;
    void resultName.offsetWidth;
    resultName.classList.add("win");
    resultNote.textContent = NOTES[m.name] || "맛있게 드세요!";
    ticketNo += 1;
    document.getElementById("ticketNo").textContent = "No. " + String(ticketNo).padStart(4, "0");
    history.unshift(m.name); if (history.length > 6) history.pop();
    historyEl.replaceChildren(...history.map(h => { const s = document.createElement("span"); s.textContent = h; return s; }));
    renderList();
  }

  function setBusy(b) {
    spinBtn.disabled = b;
    spinBtn.textContent = b ? "돌아가는 중…" : "다시 돌리기!";
    listEl.querySelectorAll("button").forEach(x => x.disabled = b || menus.length <= MIN);
  }
  function clearHit() { listEl.querySelectorAll("li.hit").forEach(li => li.classList.remove("hit")); }

  function renderList() {
    listEl.replaceChildren(...menus.map((m, i) => {
      const li = document.createElement("li");
      if (i === lastIndex) li.classList.add("hit");
      const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = COLORS[i % COLORS.length];
      const name = document.createElement("span"); name.className = "menu-name"; name.textContent = m.name;
      if (m.tag) { const s = document.createElement("small"); s.textContent = m.tag; name.append(s); }
      const del = document.createElement("button"); del.className = "del"; del.type = "button";
      del.textContent = "×"; del.setAttribute("aria-label", m.name + " 빼기");
      del.disabled = spinning || menus.length <= MIN;
      del.addEventListener("click", () => {
        menus.splice(i, 1); lastIndex = -1; save(); renderList(); draw();
      });
      li.append(dot, name, del);
      return li;
    }));
    countEl.textContent = `· ${menus.length}개`;
  }

  document.getElementById("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const input = document.getElementById("newMenu");
    const v = input.value.trim();
    if (!v) { formHint.textContent = "메뉴 이름을 입력해 주세요."; return; }
    if (menus.length >= MAX) { formHint.textContent = `메뉴는 최대 ${MAX}개까지예요. 하나를 빼고 추가해 주세요.`; return; }
    if (menus.some(m => m.name === v)) { formHint.textContent = `"${v}"는 이미 메뉴판에 있어요.`; return; }
    menus.push({ name: v, tag: "" }); input.value = ""; lastIndex = -1;
    formHint.textContent = `"${v}" 추가됨.`;
    save(); renderList(); draw();
  });

  document.getElementById("reset").addEventListener("click", () => {
    if (spinning) return;
    menus = DEFAULTS.map(m => ({ ...m })); lastIndex = -1;
    formHint.textContent = "기본 메뉴 10가지로 돌아왔어요.";
    save(); renderList(); draw();
  });

  spinBtn.addEventListener("click", spin);
  new ResizeObserver(resize).observe(canvas);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  if (document.fonts) document.fonts.ready.then(draw);
  renderList();
  resize();
})();
</script>

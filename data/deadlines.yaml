# 마감 기한 대장
#
# recurrence — 기한 생성 규칙 (한 가지 형태로 통일한다)
#   months: 적용 월 목록. 생략하거나 null이면 매월.
#   day:    해당 월의 일자. 정수 또는 last(말일).
#
# holiday_rule — 기한일이 휴일일 때 보정
#   next_business_day     다음 영업일 (세법 기한의 기본. 국세기본법 제5조)
#   previous_business_day 직전 영업일
#   none                  보정하지 않음
#
# scope — 어느 휴일 집합을 쉬는 날로 보는가 (scripts/holidays.py 참조)
#   tax   공휴일·토요일·근로자의 날 (국세기본법 제5조)
#   govt  관공서 공휴일만 (근로자의 날 제외)
#
# leads — 며칠 전에 알릴지. 0은 당일.
#
# effective_from / effective_until — 규칙 변경이 있는 항목의 적용 구간 (생략 시 상시)
#
# verified — 1차 출처(법령 원문·감독당국 서식)로 확인했는가.
#   false인 항목은 알림 메일에 「미검증」 표시가 붙는다. 기억으로 쓴 날짜를 true로 올리지 않는다.

meta:
  updated_on: 2026-10-10
  owner_note: |
    감독 보고와 내부 결산 일정은 사용자만 알 수 있어 틀만 두었다. 실제 기한을 확인해
    채우고 verified를 올린다. 금액·거래상대·내부 조직명은 적지 않는다.

deadlines:
  # ========================= 세무 =========================
  - id: wht-monthly
    name: 원천세 신고·납부
    category: 세무
    recurrence: { day: 10 }
    holiday_rule: next_business_day
    scope: tax
    leads: [7, 3, 1, 0]
    basis: 소득세법 제128조 — 징수일이 속한 달의 다음 달 10일까지 납부
    source: https://www.nts.go.kr/nts/ad/taxSchdul/selectList.do?mi=135747
    note: |
      반기납부는 상시고용인원 20인 이하 소규모 사업자 대상이므로 보험사는 해당하지 않는다.
      보험차익·연금소득 원천징수분이 함께 걸린다.
    verified: false

  - id: simple-stmt-business-other
    name: 간이지급명세서 (사업소득·기타소득)
    category: 세무
    recurrence: { day: last }
    holiday_rule: next_business_day
    scope: tax
    leads: [7, 3, 1, 0]
    basis: 소득세법 제164조의3 — 지급일이 속한 달의 다음 달 말일까지 매월 제출
    source: https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?mi=40349&cntntsId=238925
    verified: false

  - id: simple-stmt-wage-semiannual
    name: 간이지급명세서 (근로소득) — 반기 제출
    category: 세무
    recurrence: { months: [1, 7], day: last }
    holiday_rule: next_business_day
    scope: tax
    leads: [14, 7, 3, 1, 0]
    basis: 지급일이 속한 반기의 마지막 달 다음 달 말일 (1~6월분 7월 말, 7~12월분 익년 1월 말)
    source: https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?mi=40678&cntntsId=239032
    effective_until: 2027-01-31
    note: |
      2027년 1월 지급분부터 매월 제출로 바뀐다 → simple-stmt-wage-monthly로 승계.
      effective_until은 기한일 기준이다. 2026년 하반기 지급분의 반기 제출 기한이
      2027-01-31이므로 그 날까지 유효하다.
    verified: false

  - id: simple-stmt-wage-monthly
    name: 간이지급명세서 (근로소득) — 매월 제출
    category: 세무
    recurrence: { day: last }
    holiday_rule: next_business_day
    scope: tax
    leads: [7, 3, 1, 0]
    basis: 2027년 1월 지급분부터 매월 제출. 지급일이 속한 달의 다음 달 말일
    source: https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?mi=40678&cntntsId=239032
    effective_from: 2027-02-01
    note: 시행 시점을 1차 출처로 재확인한 뒤 verified를 올린다
    verified: false

  - id: pay-stmt-annual-wage-business
    name: 지급명세서 (근로·사업소득) 연간 제출
    category: 세무
    recurrence: { months: [3], day: 10 }
    holiday_rule: next_business_day
    scope: tax
    leads: [14, 7, 3, 1, 0]

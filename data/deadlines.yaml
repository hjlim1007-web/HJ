    verified: false

  - id: corp-tax-annual
    name: 법인세 신고·납부 (12월 결산)
    category: 세무
    recurrence: { months: [3], day: last }
    holiday_rule: next_business_day
    scope: tax
    leads: [30, 14, 7, 3, 1, 0]
    basis: 법인세법 제60조 — 사업연도 종료일이 속하는 달의 말일부터 3개월 이내
    source: https://www.law.go.kr/
    note: 2026 사업연도부터 법인세율 1%p 인상분이 반영된다
    verified: false

  - id: corp-tax-interim
    name: 법인세 중간예납 (12월 결산)
    category: 세무
    recurrence: { months: [8], day: last }
    holiday_rule: next_business_day
    scope: tax
    leads: [30, 14, 7, 3, 1, 0]
    basis: 법인세법 제63조 — 중간예납기간(1.1~6.30) 종료일부터 2개월 이내
    source: https://www.taxtimes.co.kr/mobile/article.html?no=276257
    note: 세액 1천만원 초과 시 분납 가능(일반기업 1개월)
    verified: false

  - id: local-corp-tax
    name: 법인지방소득세 신고·납부
    category: 세무

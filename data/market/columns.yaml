# 시장지표 시계열의 열 정의
#
# sane_min / sane_max 는 **전망치가 아니라 입력 사고를 잡는 가드다.**
# 가장 흔한 사고는 두 가지다.
#   - 단위 실수: 원/달러를 1350이 아니라 13.5로 적는다
#   - 척도 혼용: 금리에 퍼센트(3.25)와 bp(325)를 섞는다
# 그래서 범위는 역사적 극단을 넉넉히 감싸도록 넓게 둔다. 좁히는 것이 목적이 아니다.
#
# reject_zero — 0을 거부할지. 열마다 다르다.
#   금리·환율·지수·유가에서 0은 "확인 못 한 값을 0으로 메운" 흔적이므로 거부한다.
#   스왑포인트는 0이 실제로 나올 수 있는 값이므로 거부하지 않는다.
#
# 값을 확인하지 못했으면 **빈 칸으로 둔다.** 0이나 추정치로 메우지 않는다 (CLAUDE.md).
#
# display_note — 메일·보고서에 **독자에게 보이는** 한 줄. 지표 자체의 설명만 쓴다.
# guard_note   — 이 파일을 고치는 사람을 위한 **내부 메모.** 산출물에 나가지 않는다.
#
# 알려진 한계: 2020-04 WTI 선물의 마이너스 체결 같은 사건은 sane_min에 걸려 거부된다.
# 그런 값을 실제로 적어야 하면 이 파일의 범위를 먼저 고친다.

meta:
  updated_on: 2026-10-10
  note: 범위는 오타 검출용 가드다. 시장 전망과 무관하다.


    source: https://www.nts.go.kr/nts/ad/taxSchdul/selectList.do?mi=135747
    verified: false

  - id: pay-stmt-annual-financial
    name: 지급명세서 (이자·배당 등 금융소득, 기타소득) 연간 제출
